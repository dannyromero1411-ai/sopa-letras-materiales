<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sopa PRO FINAL</title>

<style>
  body {
    font-family: Arial;
    background: #f5f1e8;
    margin: 0;
    overflow-x: hidden;

    /* 🔥 CENTRADO REAL */
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .contenedor {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 100%;
    padding: 10px;
  }

  h2 {
    color: #2f5d3a;
    margin: 10px 0;
  }

  body::before, body::after {
    content: "";
    position: fixed;
    border-radius: 50%;
    z-index: -1;
  }

  body::before {
    width: 250px;
    height: 250px;
    background: #c7e8ca;
    top: -80px;
    left: -80px;
  }

  body::after {
    width: 300px;
    height: 300px;
    background: #a5d6a7;
    bottom: -100px;
    right: -100px;
  }

  canvas {
    border: 3px solid #2f5d3a;
    background: white;
    border-radius: 12px;
    touch-action: none;
    width: 90vw;
    max-width: 500px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.15);
  }

  #info {
    margin-top: 10px;
    font-size: 18px;
    color: #2f5d3a;
    font-weight: bold;
  }

  #ganaste {
    position: fixed;
    top:0; left:0;
    width:100%; height:100%;
    display:none;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    background: rgba(0,0,0,0.85);
    color:white;
  }

  .celebrar {
    font-size: 40px;
    animation: pop 0.6s infinite alternate;
  }

  @keyframes pop {
    from { transform: scale(1); }
    to { transform: scale(1.2); }
  }

  .shake {
    animation: shake 0.3s;
  }

  @keyframes shake {
    25% { transform: translateX(-6px); }
    50% { transform: translateX(6px); }
    75% { transform: translateX(-6px); }
  }

  /* ✔️❌ animación */
  .floating-icon {
    position: fixed;
    font-size: 60px;
    animation: popUp 0.8s ease-out forwards;
    pointer-events: none;
    z-index: 9999;
  }

  @keyframes popUp {
    0% {
      transform: translate(-50%, -50%) scale(0.5);
      opacity: 0;
    }
    40% { opacity: 1; }
    100% {
      transform: translate(-50%, -150%) scale(1.3);
      opacity: 0;
    }
  }
</style>
</head>

<body>

<div class="contenedor">

<h2>Sopa de Letras 💚</h2>

<canvas id="canvas"></canvas>

<div id="info">
🧮 Puntaje: <span id="score">0</span>/9
</div>

<div id="lista"></div>

</div>

<div id="ganaste">
  <div class="celebrar">🎉 ¡GANASTE! 🎉</div>
  <button onclick="location.reload()">Reiniciar</button>
</div>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const tamaño = 14;

// 🔥 CANVAS HD
function ajustarCanvas() {
  const size = Math.min(window.innerWidth * 0.9, 500);
  const dpr = window.devicePixelRatio || 1;

  canvas.style.width = size + "px";
  canvas.style.height = size + "px";

  canvas.width = size * dpr;
  canvas.height = size * dpr;

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function getTamañoCelda() {
  return canvas.width / (window.devicePixelRatio || 1) / tamaño;
}

window.addEventListener("resize", ajustarCanvas);
ajustarCanvas();

const palabras = [
  "ALEACIONES","HIERRO","METAL","FERROSO",
  "CARBONO","NOFERROSOS","FUSION","MEZCLA","HOMOGENEA"
];

let encontradas=[];
let grid = Array.from({length:tamaño},()=>Array(tamaño).fill(""));
let seleccion=[], marcadas=[], seleccionError=[];
let arrastrando=false;

// ✔️❌ iconos
function mostrarIcono(tipo, x, y) {
  const icon = document.createElement("div");
  icon.className = "floating-icon";
  icon.innerHTML = tipo === "ok" ? "✔️" : "❌";

  icon.style.left = x + "px";
  icon.style.top = y + "px";

  document.body.appendChild(icon);
  setTimeout(() => icon.remove(), 800);
}

// palabras
function colocar(p){
  const dirs=[{df:0,dc:1},{df:1,dc:0},{df:1,dc:1},{df:-1,dc:1}];
  let ok=false;

  while(!ok){
    let d=dirs[Math.floor(Math.random()*dirs.length)];
    let f=Math.floor(Math.random()*tamaño);
    let c=Math.floor(Math.random()*tamaño);

    let puede=true;
    for(let i=0;i<p.length;i++){
      let nf=f+d.df*i,nc=c+d.dc*i;
      if(nf<0||nc<0||nf>=tamaño||nc>=tamaño||grid[nf][nc]!=""){
        puede=false; break;
      }
    }

    if(puede){
      for(let i=0;i<p.length;i++){
        grid[f+d.df*i][c+d.dc*i]=p[i];
      }
      ok=true;
    }
  }
}

function rellenar(){
  const letras="ABCDEFGHIJKLMNOPQRSTUVWXYZ";
  for(let i=0;i<tamaño;i++){
    for(let j=0;j<tamaño;j++){
      if(grid[i][j]==""){
        grid[i][j]=letras[Math.floor(Math.random()*26)];
      }
    }
  }
}

palabras.forEach(colocar);
rellenar();

function dibujar(){
  const tamañoCelda = getTamañoCelda();

  ctx.clearRect(0,0,canvas.width,canvas.height);

  ctx.font = (tamañoCelda * 0.6) + "px Arial";
  ctx.textAlign="center";
  ctx.textBaseline="middle";

  for(let i=0;i<tamaño;i++){
    for(let j=0;j<tamaño;j++){
      ctx.strokeRect(j*tamañoCelda,i*tamañoCelda,tamañoCelda,tamañoCelda);

      ctx.fillStyle="black";
      ctx.fillText(
        grid[i][j],
        j*tamañoCelda+tamañoCelda/2,
        i*tamañoCelda+tamañoCelda/2
      );
    }
  }

  ctx.fillStyle="rgba(0,200,100,0.4)";
  marcadas.forEach(c=>ctx.fillRect(c.col*tamañoCelda,c.fila*tamañoCelda,tamañoCelda,tamañoCelda));

  ctx.fillStyle="rgba(0,150,255,0.3)";
  seleccion.forEach(c=>ctx.fillRect(c.col*tamañoCelda,c.fila*tamañoCelda,tamañoCelda,tamañoCelda));

  ctx.fillStyle="rgba(255,0,0,0.4)";
  seleccionError.forEach(c=>ctx.fillRect(c.col*tamañoCelda,c.fila*tamañoCelda,tamañoCelda,tamañoCelda));
}

function celda(x,y){
  const tamañoCelda = getTamañoCelda();
  return {fila:Math.floor(y/tamañoCelda),col:Math.floor(x/tamañoCelda)};
}

function start(e){
  arrastrando=true;
  seleccion=[];
  let r=canvas.getBoundingClientRect();
  let x=(e.touches?e.touches[0].clientX:e.clientX)-r.left;
  let y=(e.touches?e.touches[0].clientY:e.clientY)-r.top;
  seleccion.push(celda(x,y));
}

function move(e){
  if(!arrastrando)return;

  let r=canvas.getBoundingClientRect();
  let x=(e.touches?e.touches[0].clientX:e.clientX)-r.left;
  let y=(e.touches?e.touches[0].clientY:e.clientY)-r.top;

  let c=celda(x,y),ini=seleccion[0];
  let df=c.fila-ini.fila,dc=c.col-ini.col;

  if(df===0||dc===0||Math.abs(df)===Math.abs(dc)){
    seleccion=[];
    let f=ini.fila,col=ini.col;
    let pf=Math.sign(df),pc=Math.sign(dc);

    while(true){
      seleccion.push({fila:f,col:col});
      if(f===c.fila&&col===c.col) break;
      f+=pf; col+=pc;
    }
  }

  dibujar();
}

function end(){
  arrastrando=false;
  verificar();
}

canvas.addEventListener("mousedown",start);
canvas.addEventListener("mousemove",move);
canvas.addEventListener("mouseup",end);

canvas.addEventListener("touchstart",start);
canvas.addEventListener("touchmove",(e)=>{e.preventDefault();move(e);},{passive:false});
canvas.addEventListener("touchend",end);

function verificar(){
  let palabra=seleccion.map(c=>grid[c.fila][c.col]).join("");

  const r = canvas.getBoundingClientRect();

  if(palabras.includes(palabra)&&!encontradas.includes(palabra)){
    encontradas.push(palabra);
    marcadas.push(...seleccion);
    mostrarIcono("ok", r.left + r.width/2, r.top + r.height/2);
    actualizar();
  } else {
    seleccionError=[...seleccion];
    mostrarIcono("no", r.left + r.width/2, r.top + r.height/2);

    canvas.classList.remove("shake");
    void canvas.offsetWidth;
    canvas.classList.add("shake");

    setTimeout(()=>{
      seleccionError=[];
      dibujar();
    },600);
  }

  if(encontradas.length===palabras.length){
    document.getElementById("ganaste").style.display="flex";
  }

  setTimeout(()=>{seleccion=[];dibujar();},400);
}

function actualizar(){
  document.getElementById("lista").innerHTML =
    "Encuentra: "+
    palabras.map(p=>encontradas.includes(p)?"✔️ "+p:p).join(", ");

  document.getElementById("score").innerText=encontradas.length;
}

actualizar();
dibujar();
</script>

</body>
</html>
