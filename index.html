<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sopa de Letras</title>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

<style>
  body{
    margin:0;
    font-family:Arial;
    background:#f5f1e8;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow-x:hidden;
  }

  body::before,body::after{
    content:"";
    position:fixed;
    border-radius:50%;
    z-index:-1;
  }

  body::before{
    width:280px;height:280px;
    background:#bfe6c2;
    top:-90px;left:-90px;
  }

  body::after{
    width:320px;height:320px;
    background:#8fd19e;
    bottom:-120px;right:-120px;
  }

  .contenedor{
    text-align:center;
    width:100%;
    padding:10px;
  }

  h2{color:#2f5d3a;margin:5px 0;}

  #usuario{
    font-size:16px;
    color:#2f5d3a;
    margin-bottom:5px;
  }

  canvas{
    border:3px solid #2f5d3a;
    background:white;
    border-radius:12px;
    width:90vw;
    max-width:500px;
    touch-action:none;
    box-shadow:0 10px 25px rgba(0,0,0,0.15);
  }

  #info{
    margin-top:10px;
    font-weight:bold;
    color:#2f5d3a;
  }

  #lista{
    margin-top:10px;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:4px;
    font-size:14px;
    color:#2f5d3a;
    max-width:500px;
    margin:auto;
  }

  #win{
    position:fixed;
    top:0;left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.6);
    display:none;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    color:white;
    font-size:28px;
    text-align:center;
    z-index:99999;
    padding:20px;
  }

  #win button{
    margin-top:20px;
    padding:10px 20px;
    border:none;
    border-radius:10px;
    background:#2f5d3a;
    color:white;
    font-size:16px;
  }
</style>
</head>

<body>

<div class="contenedor">

<h2>Sopa de Letras</h2>
<div id="usuario"></div>

<canvas id="canvas"></canvas>

<div id="info">
🧮 Puntaje: <span id="score">0</span>/9 |
⏱️ Tiempo: <span id="tiempo">00:00</span>
</div>

<div id="lista"></div>

</div>

<div id="win"></div>

<script>

/* ================= FIREBASE CONFIG ================= */
const firebaseConfig = {
  apiKey: "AIzaSyDm6yIhx-AwkGe9Imn4MPR7nVt2tc2-HKs",
  authDomain: "sopa-de-letras-6680c.firebaseapp.com",
  databaseURL: "https://sopa-de-letras-6680c-default-rtdb.firebaseio.com",
  projectId: "sopa-de-letras-6680c",
  storageBucket: "sopa-de-letras-6680c.appspot.com",
  messagingSenderId: "869016614040",
  appId: "1:869016614040:web:b2b818f61578539f170ced"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

/* ================= JUGADOR ================= */
let nombre = localStorage.getItem("jugador");

if(!nombre){
  nombre = prompt("Ingresa tu apodo:");
  while(!nombre || nombre.trim()===""){
    nombre = prompt("Ingresa un apodo válido:");
  }
  localStorage.setItem("jugador",nombre);
}

document.getElementById("usuario").innerText = "👋 Jugador: " + nombre;

/* ================= RANKING GLOBAL ================= */

function guardarRanking(nombre, tiempo){
  db.ref("ranking").push({
    nombre,
    tiempo,
    fecha: Date.now()
  });
}

async function obtenerRankingHTML(){
  let snap = await db.ref("ranking").once("value");
  let data = snap.val() || {};
  let arr = Object.values(data);

  arr.sort((a,b)=>a.tiempo-b.tiempo);

  let html = "<h3>🏆 Ranking Global</h3>";

  arr.slice(0,10).forEach((r,i)=>{
    let icono = i==0?"🥇":i==1?"🥈":i==2?"🥉":i+1+".";
    html += `<div>${icono} ${r.nombre} - ${formatearTiempo(r.tiempo)}</div>`;
  });

  return html;
}

/* ================= JUEGO ================= */

const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

const tamaño=14;

let grid=Array.from({length:tamaño},()=>Array(tamaño).fill(""));
let seleccion=[],marcadas=[],error=[];
let encontradas=[];

const palabras=[
  "ALEACIONES","HIERRO","METAL","FERROSO",
  "CARBONO","NOFERROSOS","FUSION","MEZCLA","HOMOGENEA"
];

let tiempo = 0;
let intervalo;

function formatearTiempo(seg){
  let min = Math.floor(seg / 60);
  let sec = seg % 60;
  return `${min.toString().padStart(2,"0")}:${sec.toString().padStart(2,"0")}`;
}

function iniciarTiempo(){
  intervalo = setInterval(()=>{
    tiempo++;
    document.getElementById("tiempo").innerText = formatearTiempo(tiempo);
  },1000);
}

function detenerTiempo(){
  clearInterval(intervalo);
}

/* sonidos */
const audio=new (window.AudioContext||window.webkitAudioContext)();

function beep(f,t,v=0.5){
  if(audio.state==="suspended") audio.resume();
  let o=audio.createOscillator();
  let g=audio.createGain();
  o.frequency.value=f;
  o.type="square";
  g.gain.value=v;
  g.gain.exponentialRampToValueAtTime(0.001,audio.currentTime+t);
  o.connect(g);
  g.connect(audio.destination);
  o.start();
  o.stop(audio.currentTime+t);
}

const okSound=()=>{beep(800,0.1,0.6);setTimeout(()=>beep(1100,0.1,0.6),100);};
const noSound=()=>{beep(120,0.25,0.9);setTimeout(()=>beep(90,0.25,0.9),120);};

function confeti(){
  for(let i=0;i<100;i++){
    let d=document.createElement("div");
    d.className="confeti";
    d.style.left=Math.random()*100+"vw";
    d.style.background=`hsl(${Math.random()*360},70%,60%)`;
    document.body.appendChild(d);
    setTimeout(()=>d.remove(),2500);
  }
}

function icono(tipo,x,y){
  let d=document.createElement("div");
  d.className="icono";
  d.innerHTML = tipo==="ok" ? "✔️" : "❌";
  d.style.left=x+"px";
  d.style.top=y+"px";
  document.body.appendChild(d);
  setTimeout(()=>d.remove(),700);
}

/* ===== GRID ===== */

function ajustar(){
  const size=Math.min(window.innerWidth*0.9,500);
  const dpr=window.devicePixelRatio||1;

  canvas.style.width=size+"px";
  canvas.style.height=size+"px";

  canvas.width=size*dpr;
  canvas.height=size*dpr;

  ctx.setTransform(dpr,0,0,dpr,0,0);

  dibujar();
}
window.addEventListener("resize",ajustar);
ajustar();

function sizeCelda(){
  return canvas.width/(window.devicePixelRatio||1)/tamaño;
}

function celda(x,y){
  const s=sizeCelda();
  return {fila:Math.floor(y/s),col:Math.floor(x/s)};
}

/* ===== VERIFICAR ===== */

async function verificar(){

  let palabra = seleccion.map(c => grid[c.fila][c.col]).join("");
  let invertida = palabra.split("").reverse().join("");

  const r = canvas.getBoundingClientRect();

  let valida = palabras.includes(palabra) || palabras.includes(invertida);
  let usada = encontradas.includes(palabra) || encontradas.includes(invertida);

  if(valida && !usada){

    let real = palabras.includes(palabra) ? palabra : invertida;

    encontradas.push(real);
    marcadas.push(...seleccion);

    okSound();
    icono("ok", r.left + r.width/2, r.top + r.height/2);

  } else {
    error=[...seleccion];
    noSound();
    icono("no", r.left + r.width/2, r.top + r.height/2);

    setTimeout(()=>{error=[];dibujar();},400);
  }

  document.getElementById("score").innerText=encontradas.length;

  if(encontradas.length===palabras.length){
    detenerTiempo();
    guardarRanking(nombre, tiempo);
    confeti();

    let rankingHTML = await obtenerRankingHTML();

    document.getElementById("win").innerHTML = `
      👤 ${nombre}<br>
      ⏱️ ${formatearTiempo(tiempo)}<br><br>
      ${rankingHTML}
      <br><button onclick="location.reload()">Reiniciar</button>
    `;

    document.getElementById("win").style.display="flex";
  }

  seleccion=[];
  dibujar();
}

/* resto del juego igual (no lo toqué para no romperlo) */

iniciarTiempo();

</script>

</body>
</html>
