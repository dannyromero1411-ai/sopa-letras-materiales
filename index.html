<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sopa de Letras PRO</title>

<style>
  body {
    margin: 0;
    font-family: Arial;
    background: #f5f1e8;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow-x: hidden;
  }

  body::before, body::after {
    content: "";
    position: fixed;
    border-radius: 50%;
    z-index: -1;
  }

  body::before {
    width: 280px;
    height: 280px;
    background: #bfe6c2;
    top: -90px;
    left: -90px;
  }

  body::after {
    width: 320px;
    height: 320px;
    background: #8fd19e;
    bottom: -120px;
    right: -120px;
  }

  .contenedor {
    text-align: center;
    width: 100%;
    padding: 10px;
    transform: translateY(-8px);
  }

  h2 {
    color: #2f5d3a;
    margin: 10px 0;
  }

  canvas {
    border: 3px solid #2f5d3a;
    background: white;
    border-radius: 12px;
    width: 90vw;
    max-width: 500px;
    touch-action: none;
    box-shadow: 0 10px 25px rgba(0,0,0,0.15);
  }

  #info {
    margin-top: 10px;
    font-weight: bold;
    color: #2f5d3a;
  }

  #lista {
    margin-top: 5px;
    color: #2f5d3a;
  }

  /* ✔️❌ animación */
  .icono {
    position: fixed;
    font-size: 60px;
    animation: pop 0.8s ease-out forwards;
    pointer-events: none;
    z-index: 9999;
  }

  @keyframes pop {
    0% { transform: translate(-50%,-50%) scale(0.3); opacity: 0; }
    40% { opacity: 1; }
    100% { transform: translate(-50%,-140%) scale(1.2); opacity: 0; }
  }

  .shake {
    animation: shake 0.3s;
  }

  @keyframes shake {
    25% { transform: translateX(-6px); }
    50% { transform: translateX(6px); }
    75% { transform: translateX(-6px); }
  }

  /* 🎉 confeti */
  .confeti {
    position: fixed;
    width: 8px;
    height: 8px;
    background: red;
    top: -10px;
    animation: caer 2s linear forwards;
    z-index: 9999;
  }

  @keyframes caer {
    to {
      transform: translateY(100vh) rotate(360deg);
      opacity: 0;
    }
  }
</style>
</head>

<body>

<div class="contenedor">

<h2>Sopa de Letras 💚</h2>

<canvas id="canvas"></canvas>

<div id="info">
🧮 Puntaje: <span id="score">0</span>/9
</div>

<div id="lista"></div>

</div>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const tamaño = 14;

let grid = Array.from({length:tamaño},()=>Array(tamaño).fill(""));
let seleccion=[], marcadas=[], error=[];
let encontradas=[];

const palabras = [
  "ALEACIONES","HIERRO","METAL","FERROSO",
  "CARBONO","NOFERROSOS","FUSION","MEZCLA","HOMOGENEA"
];

// 🔊 audio simple
const audio = new (window.AudioContext || window.webkitAudioContext)();

function beep(freq, time){
  let o = audio.createOscillator();
  let g = audio.createGain();

  o.frequency.value = freq;
  o.connect(g);
  g.connect(audio.destination);

  g.gain.setValueAtTime(0.2,audio.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,audio.currentTime+time);

  o.start();
  o.stop(audio.currentTime+time);
}

const sonidoOK = ()=>{ beep(700,0.1); setTimeout(()=>beep(1000,0.1),100); }
const sonidoNO = ()=> beep(150,0.2);

// 🎉 confeti
function confeti(){
  for(let i=0;i<80;i++){
    let c=document.createElement("div");
    c.className="confeti";
    c.style.left=Math.random()*100+"vw";
    c.style.background=`hsl(${Math.random()*360},70%,60%)`;
    c.style.animationDuration=(1+Math.random()*2)+"s";
    document.body.appendChild(c);
    setTimeout(()=>c.remove(),2500);
  }
}

// canvas HD
function ajustar(){
  const size = Math.min(window.innerWidth * 0.9, 500);
  const dpr = window.devicePixelRatio || 1;

  canvas.style.width = size+"px";
  canvas.style.height = size+"px";

  canvas.width = size*dpr;
  canvas.height = size*dpr;

  ctx.setTransform(dpr,0,0,dpr,0,0);

  dibujar();
}

window.addEventListener("resize",ajustar);
ajustar();

function sizeCelda(){
  return canvas.width / (window.devicePixelRatio || 1) / tamaño;
}

function celda(x,y){
  const s=sizeCelda();
  return {fila:Math.floor(y/s),col:Math.floor(x/s)};
}

// palabras
function colocar(p){
  const dirs=[{df:0,dc:1},{df:1,dc:0},{df:1,dc:1},{df:-1,dc:1}];
  let ok=false;

  while(!ok){
    let d=dirs[Math.floor(Math.random()*dirs.length)];
    let f=Math.floor(Math.random()*tamaño);
    let c=Math.floor(Math.random()*tamaño);

    let posible=true;

    for(let i=0;i<p.length;i++){
      let nf=f+d.df*i,nc=c+d.dc*i;
      if(nf<0||nc<0||nf>=tamaño||nc>=tamaño||grid[nf][nc]!=""){
        posible=false; break;
      }
    }

    if(posible){
      for(let i=0;i<p.length;i++){
        grid[f+d.df*i][c+d.dc*i]=p[i];
      }
      ok=true;
    }
  }
}

function rellenar(){
  const letras="ABCDEFGHIJKLMNOPQRSTUVWXYZ";
  for(let i=0;i<tamaño;i++){
    for(let j=0;j<tamaño;j++){
      if(grid[i][j]==""){
        grid[i][j]=letras[Math.floor(Math.random()*26)];
      }
    }
  }
}

palabras.forEach(colocar);
rellenar();

// 🎨 dibujar
function dibujar(){
  const s=sizeCelda();

  ctx.clearRect(0,0,canvas.width,canvas.height);

  ctx.font=(s*0.6)+"px Arial";
  ctx.textAlign="center";
  ctx.textBaseline="middle";

  for(let i=0;i<tamaño;i++){
    for(let j=0;j<tamaño;j++){
      ctx.strokeRect(j*s,i*s,s,s);
      ctx.fillStyle="black";
      ctx.fillText(grid[i][j],j*s+s/2,i*s+s/2);
    }
  }

  ctx.fillStyle="rgba(0,200,100,0.4)";
  marcadas.forEach(c=>ctx.fillRect(c.col*s,c.fila*s,s,s));

  ctx.fillStyle="rgba(255,0,0,0.4)";
  error.forEach(c=>ctx.fillRect(c.col*s,c.fila*s,s,s));

  if(seleccion.length>0){
    ctx.fillStyle="rgba(0,150,255,0.25)";
    seleccion.forEach(c=>ctx.fillRect(c.col*s,c.fila*s,s,s));
  }
}

// ✔️❌ icono
function icono(tipo,x,y){
  const d=document.createElement("div");
  d.className="icono";
  d.innerHTML=tipo==="ok"?"✔️":"❌";
  d.style.left=x+"px";
  d.style.top=y+"px";
  document.body.appendChild(d);
  setTimeout(()=>d.remove(),800);
}

// interacción tipo app
let arrastrando=false;

canvas.addEventListener("mousedown",start);
canvas.addEventListener("mousemove",move);
canvas.addEventListener("mouseup",end);

canvas.addEventListener("touchstart",start);
canvas.addEventListener("touchmove",(e)=>{e.preventDefault();move(e);},{passive:false});
canvas.addEventListener("touchend",end);

function start(e){
  arrastrando=true;
  seleccion=[];
  let r=canvas.getBoundingClientRect();
  let x=(e.touches?e.touches[0].clientX:e.clientX)-r.left;
  let y=(e.touches?e.touches[0].clientY:e.clientY)-r.top;
  seleccion.push(celda(x,y));
}

function move(e){
  if(!arrastrando)return;

  let r=canvas.getBoundingClientRect();
  let x=(e.touches?e.touches[0].clientX:e.clientX)-r.left;
  let y=(e.touches?e.touches[0].clientY:e.clientY)-r.top;

  let c=celda(x,y),i=seleccion[0];
  let df=c.fila-i.fila,dc=c.col-i.col;

  if(df===0||dc===0||Math.abs(df)===Math.abs(dc)){
    seleccion=[];
    let f=i.fila,col=i.col;
    let pf=Math.sign(df),pc=Math.sign(dc);

    while(true){
      seleccion.push({fila:f,col:col});
      if(f===c.fila&&col===c.col) break;
      f+=pf; col+=pc;
    }
  }

  dibujar();
}

function end(){
  arrastrando=false;
  verificar();
}

// lógica
function verificar(){
  let palabra=seleccion.map(c=>grid[c.fila][c.col]).join("");

  const r=canvas.getBoundingClientRect();

  if(palabras.includes(palabra) && !encontradas.includes(palabra)){
    encontradas.push(palabra);
    marcadas.push(...seleccion);

    sonidoOK();
    icono("ok",r.left+r.width/2,r.top+r.height/2);
  } else {
    error=[...seleccion];

    sonidoNO();
    icono("no",r.left+r.width/2,r.top+r.height/2);

    canvas.classList.remove("shake");
    void canvas.offsetWidth;
    canvas.classList.add("shake");

    setTimeout(()=>{ error=[]; dibujar(); },500);
  }

  actualizar();

  if(encontradas.length===palabras.length){
    confeti();
  }

  setTimeout(()=>{
    seleccion=[];
    dibujar();
  },300);
}

// UI
function actualizar(){
  document.getElementById("lista").innerHTML =
    palabras.map(p=>encontradas.includes(p)?"✔️ "+p:p).join(", ");

  document.getElementById("score").innerText=encontradas.length;
}

actualizar();
dibujar();
</script>

</body>
</html>
