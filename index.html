<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sopa de Letras</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#f5f1e8;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
}

canvas{
  border:3px solid #2f5d3a;
  background:white;
  border-radius:12px;
  touch-action:none;
}

/* INICIO */
#inicio{
  position:fixed;
  inset:0;
  background:#f5f1e8;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  z-index:9999;
}

#inicio input{
  padding:10px;
  border:2px solid #2f5d3a;
  border-radius:8px;
  margin:10px;
}

#inicio button{
  padding:10px 20px;
  background:#2f5d3a;
  color:white;
  border:none;
  border-radius:10px;
}

#rankingInicio{
  margin-top:10px;
  font-size:14px;
  color:#2f5d3a;
  text-align:center;
}

/* LISTA */
#lista{
  margin-top:10px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:6px;
  font-size:14px;
}

.word.ok{
  background:#b7f5c2;
  text-decoration:line-through;
}

/* FINAL */
#finalScreen{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.85);
  display:none;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  color:white;
  z-index:99999;
  text-align:center;
}

#finalScreen button{
  margin-top:20px;
  padding:10px 20px;
}

/* ICONO */
.icono{
  position:fixed;
  font-size:55px;
  animation:pop .6s ease-out forwards;
}

@keyframes pop{
  0%{transform:scale(0.3);opacity:0;}
  50%{opacity:1;}
  100%{transform:scale(1.3);opacity:0;}
}

/* SHAKE */
.shake{animation:shake .3s;}

@keyframes shake{
  0%{transform:translateX(0);}
  25%{transform:translateX(-6px);}
  50%{transform:translateX(6px);}
  75%{transform:translateX(-6px);}
  100%{transform:translateX(0);}
}
</style>
</head>

<body>

<div id="inicio">
  <h2>🎮 Sopa de Letras</h2>
  <input id="nombreInput" placeholder="Apodo">
  <button onclick="startGame()">Comenzar</button>
  <div id="rankingInicio"></div>
</div>

<div>
  <canvas id="canvas"></canvas>
  <div>⏱️ <span id="tiempo">00:00</span></div>
  <div id="lista"></div>
</div>

<div id="finalScreen">
  <h2>🎉 Juego terminado</h2>
  <div id="finalInfo"></div>
  <div id="finalLugar"></div>
  <button onclick="location.reload()">Reiniciar</button>
</div>

<script>

/* ===== VARIABLES ===== */
let nombre = localStorage.getItem("jugador") || "";
let size = 12;

let grid=[], seleccion=[], marcadas=[], encontradas=[], error=[];

let tiempo=0, intervalo;

const palabras=[
"ALEACIONES","HIERRO","METAL",
"CARBONO","FUSION","MEZCLA","HOMOGENEA"
];

const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

let audio;

/* ===== AUDIO ===== */
function initAudio(){
  audio = new (window.AudioContext || window.webkitAudioContext)();
  if(audio.state==="suspended") audio.resume();
}

function beep(f,t,v=0.5){
  if(!audio) return;

  let o=audio.createOscillator();
  let g=audio.createGain();

  o.frequency.value=f;
  o.connect(g);
  g.connect(audio.destination);

  g.gain.setValueAtTime(v,audio.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,audio.currentTime+t);

  o.start();
  o.stop(audio.currentTime+t);
}

function okSound(){ beep(800,0.1); setTimeout(()=>beep(1100,0.1),100); }
function noSound(){ beep(220,0.18,0.8); setTimeout(()=>beep(140,0.18,0.75),90); }
function winSound(){ beep(523,0.15); setTimeout(()=>beep(659,0.15),120); setTimeout(()=>beep(784,0.2),240); }

/* ===== RANKING ===== */
function getRanking(){
  return JSON.parse(localStorage.getItem("ranking")) || [];
}

function saveRanking(nombre, tiempo){
  let r=getRanking();
  let j=r.find(x=>x.nombre===nombre);

  if(j){
    if(tiempo<j.tiempo) j.tiempo=tiempo;
  } else {
    r.push({nombre,tiempo});
  }

  r.sort((a,b)=>a.tiempo-b.tiempo);
  localStorage.setItem("ranking",JSON.stringify(r));
  return r;
}

function mostrarRanking(){
  let r=getRanking();

  let html="<h3>🏆 Ranking</h3>";

  if(r.length===0){
    html+="<div>Sin registros</div>";
  } else {
    r.slice(0,10).forEach((x,i)=>{
      let t=new Date(x.tiempo*1000).toISOString().substr(14,5);
      html+=`<div>${i+1}. ${x.nombre} - ${t}</div>`;
    });
  }

  document.getElementById("rankingInicio").innerHTML=html;
}

/* ===== INICIO ===== */
window.onload=()=>{
  document.getElementById("inicio").style.display="flex";

  if(nombre){
    document.getElementById("nombreInput").value=nombre;
    document.getElementById("nombreInput").disabled=true;
  }

  mostrarRanking();
};

function startGame(){
  initAudio();

  if(!nombre){
    let v=document.getElementById("nombreInput").value;
    if(!v) return;

    nombre=v;
    localStorage.setItem("jugador",nombre);
    document.getElementById("nombreInput").disabled=true;
  }

  document.getElementById("inicio").style.display="none";
  init();
}

/* ===== JUEGO ===== */
function init(){
  grid=Array.from({length:size},()=>Array(size).fill(""));

  palabras.forEach(place);
  fill();

  canvas.width=canvas.height=500;

  draw();
  timer();
  update();
}

/* ===== colocar ===== */
function place(word){
  let ok=false;

  while(!ok){
    let r=Math.floor(Math.random()*size);
    let c=Math.floor(Math.random()*size);

    let dirs=[[0,1],[1,0],[1,1],[-1,1]];
    let d=dirs[Math.floor(Math.random()*dirs.length)];

    let test=true;

    for(let i=0;i<word.length;i++){
      let nr=r+d[0]*i,nc=c+d[1]*i;
      if(nr<0||nc<0||nr>=size||nc>=size||grid[nr][nc]!=""){
        test=false;
        break;
      }
    }

    if(test){
      for(let i=0;i<word.length;i++){
        grid[r+d[0]*i][c+d[1]*i]=word[i];
      }
      ok=true;
    }
  }
}

/* ===== fill ===== */
function fill(){
  let a="ABCDEFGHIJKLMNOPQRSTUVWXYZ";

  for(let i=0;i<size;i++){
    for(let j=0;j<size;j++){
      if(!grid[i][j]){
        grid[i][j]=a[Math.floor(Math.random()*26)];
      }
    }
  }
}

/* ===== DRAW (FIX IMPORTANTE: SIEMPRE NEGRO) ===== */
function draw(){
  let s=canvas.width/size;

  ctx.clearRect(0,0,canvas.width,canvas.height);

  ctx.font="18px Arial";
  ctx.textAlign="center";
  ctx.textBaseline="middle";

  for(let i=0;i<size;i++){
    for(let j=0;j<size;j++){

      // borde
      ctx.strokeStyle="#999";
      ctx.strokeRect(j*s,i*s,s,s);

      // SIEMPRE NEGRO (FIX PRINCIPAL)
      ctx.fillStyle="#000";
      ctx.fillText(grid[i][j],j*s+s/2,i*s+s/2);
    }
  }

  ctx.fillStyle="rgba(0,150,255,0.3)";
  seleccion.forEach(c=>ctx.fillRect(c.col*s,c.fila*s,s,s));

  ctx.fillStyle="rgba(0,200,100,0.4)";
  marcadas.forEach(c=>ctx.fillRect(c.col*s,c.fila*s,s,s));

  ctx.fillStyle="rgba(255,0,0,0.3)";
  error.forEach(c=>ctx.fillRect(c.col*s,c.fila*s,s,s));
}

/* ===== INPUT ===== */
let active=false;

canvas.addEventListener("mousedown",start);
canvas.addEventListener("mousemove",move);
canvas.addEventListener("mouseup",end);

function pos(e){
  let r=canvas.getBoundingClientRect();
  let x=e.clientX-r.left;
  let y=e.clientY-r.top;
  let s=canvas.width/size;

  return {fila:Math.floor(y/s),col:Math.floor(x/s)};
}

function start(e){
  active=true;
  seleccion=[pos(e)];
}

function move(e){
  if(!active)return;

  let p=pos(e);
  let i=seleccion[0];

  let df=p.fila-i.fila;
  let dc=p.col-i.col;

  let steps=Math.max(Math.abs(df),Math.abs(dc));

  let pf=df?df/Math.abs(df):0;
  let pc=dc?dc/Math.abs(dc):0;

  seleccion=[i];

  for(let k=1;k<=steps;k++){
    seleccion.push({fila:i.fila+pf*k,col:i.col+pc*k});
  }

  draw();
}

function end(){
  active=false;
  check();
}

/* ===== CHECK (ESPEJO OK) ===== */
function check(){

  let w=seleccion.map(c=>grid[c.fila][c.col]).join("");
  let wr=[...seleccion].reverse().map(c=>grid[c.fila][c.col]).join("");

  let ok=palabras.includes(w)?w:
          palabras.includes(wr)?wr:null;

  if(ok && !encontradas.includes(ok)){
    encontradas.push(ok);
    marcadas.push(...seleccion);
    okSound();
    icono("✔️");
  } else {
    error=[...seleccion];
    noSound();
    icono("❌");

    canvas.classList.add("shake");
    setTimeout(()=>canvas.classList.remove("shake"),300);

    setTimeout(()=>{
      error=[];
      draw();
    },250);
  }

  seleccion=[];
  update();
  draw();

  if(encontradas.length===palabras.length){
    finish();
  }
}

/* ===== ICONO ===== */
function icono(t){
  let d=document.createElement("div");
  d.className="icono";
  d.innerHTML=t;

  d.style.left=(window.innerWidth/2)+"px";
  d.style.top=(window.innerHeight/2)+"px";

  document.body.appendChild(d);
  setTimeout(()=>d.remove(),600);
}

/* ===== LISTA ===== */
function update(){
  document.getElementById("lista").innerHTML=
    palabras.map(p=>{
      let ok=encontradas.includes(p);
      return `<div class="word ${ok?'ok':''}">${p}</div>`;
    }).join("");
}

/* ===== TIMER ===== */
function timer(){
  intervalo=setInterval(()=>{
    tiempo++;
    document.getElementById("tiempo").innerText=
      new Date(tiempo*1000).toISOString().substr(14,5);
  },1000);
}

/* ===== FINAL ===== */
function finish(){
  clearInterval(intervalo);

  let r=saveRanking(nombre,tiempo);
  let pos=r.findIndex(x=>x.nombre===nombre)+1;

  winSound();

  let lugar=
    pos===1?"🥇 Lugar 1":
    pos===2?"🥈 Lugar 2":
    pos===3?"🥉 Lugar 3":
    "#"+pos;

  document.getElementById("finalInfo").innerHTML=
    "⏱️ Tiempo: "+new Date(tiempo*1000).toISOString().substr(14,5);

  document.getElementById("finalLugar").innerHTML=lugar;

  document.getElementById("finalScreen").style.display="flex";
}

</script>
</body>
</html>
