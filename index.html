<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sopa de Letras</title>

<style>
  body{
    margin:0;
    font-family:Arial;
    background:#f5f1e8;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow-x:hidden;
  }

  body::before,body::after{
    content:"";
    position:fixed;
    border-radius:50%;
    z-index:-1;
  }

  body::before{
    width:280px;height:280px;
    background:#bfe6c2;
    top:-90px;left:-90px;
  }

  body::after{
    width:320px;height:320px;
    background:#8fd19e;
    bottom:-120px;right:-120px;
  }

  .contenedor{
    text-align:center;
    width:100%;
    padding:10px;
  }

  h2{color:#2f5d3a;margin:5px 0;}

  #usuario{
    font-size:16px;
    color:#2f5d3a;
    margin-bottom:5px;
  }

  canvas{
    border:3px solid #2f5d3a;
    background:white;
    border-radius:12px;
    width:90vw;
    max-width:500px;
    touch-action:none;
    box-shadow:0 10px 25px rgba(0,0,0,0.15);
  }

  #info{
    margin-top:10px;
    font-weight:bold;
    color:#2f5d3a;
  }

  #lista{
    margin-top:10px;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:4px;
    font-size:14px;
    color:#2f5d3a;
    max-width:500px;
    margin:auto;
  }

  #lista div{
    text-align:left;
    padding:2px 6px;
  }

  .shake{animation:shake .3s;}
  @keyframes shake{
    25%{transform:translateX(-6px);}
    50%{transform:translateX(6px);}
    75%{transform:translateX(-6px);}
  }

  .confeti{
    position:fixed;
    width:8px;
    height:8px;
    top:-10px;
    z-index:9999;
    animation:fall 2s linear forwards;
  }

  @keyframes fall{
    to{
      transform:translateY(100vh) rotate(360deg);
      opacity:0;
    }
  }

  .icono{
    position:fixed;
    font-size:60px;
    animation:pop 0.7s ease-out forwards;
    pointer-events:none;
    z-index:99999;
  }

  @keyframes pop{
    0%{transform:translate(-50%,-50%) scale(0.3);opacity:0;}
    40%{opacity:1;}
    100%{transform:translate(-50%,-140%) scale(1.2);opacity:0;}
  }
</style>
</head>

<body>

<div class="contenedor">

<h2>Sopa de Letras</h2>
<div id="usuario"></div>

<canvas id="canvas"></canvas>

<div id="info">
🧮 Puntaje: <span id="score">0</span>/9 |
⏱️ Tiempo: <span id="tiempo">00:00</span>
</div>

<div id="lista"></div>

</div>

<div id="win"></div>

<script>

let nombre = localStorage.getItem("jugador");

if(!nombre){
  nombre = prompt("Ingresa tu apodo:");
  while(!nombre || nombre.trim()===""){
    nombre = prompt("Ingresa un apodo válido:");
  }
  localStorage.setItem("jugador",nombre);
}

document.getElementById("usuario").innerText = "👋 Jugador: " + nombre;

/* =========================
   🏆 RANKING CORREGIDO
========================= */
function guardarRanking(nombre, tiempo){
  let ranking = JSON.parse(localStorage.getItem("ranking")) || [];

  ranking = ranking.filter(r => r.nombre !== nombre);
  ranking.push({nombre, tiempo});

  ranking.sort((a,b)=>a.tiempo - b.tiempo);
  localStorage.setItem("ranking", JSON.stringify(ranking));
}

/* =========================
   🧠 JUEGO
========================= */

const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

const tamaño=14;

let grid=Array.from({length:tamaño},()=>Array(tamaño).fill(""));
let seleccion=[],marcadas=[],error=[];
let encontradas=[];

const palabras=[
  "ALEACIONES","HIERRO","METAL","FERROSO",
  "CARBONO","NOFERROSOS","FUSION","MEZCLA","HOMOGENEA"
];

let tiempo = 0;
let intervalo;

function formatearTiempo(seg){
  let min = Math.floor(seg / 60);
  let sec = seg % 60;
  return `${min.toString().padStart(2,"0")}:${sec.toString().padStart(2,"0")}`;
}

function iniciarTiempo(){
  intervalo = setInterval(()=>{
    tiempo++;
    document.getElementById("tiempo").innerText = formatearTiempo(tiempo);
  },1000);
}

const audio=new (window.AudioContext||window.webkitAudioContext)();

function beep(f,t,v=0.5){
  let o=audio.createOscillator();
  let g=audio.createGain();

  o.frequency.value=f;
  o.type="square";

  g.gain.value=v;
  g.gain.setValueAtTime(v,audio.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,audio.currentTime+t);

  o.connect(g);
  g.connect(audio.destination);

  o.start();
  o.stop(audio.currentTime+t);
}

/* =========================
   🔊 DIRECCIONES (CON REVERSA)
========================= */
function colocar(p){
  const dirs=[
    {df:0,dc:1},
    {df:0,dc:-1},
    {df:1,dc:0},
    {df:-1,dc:0},
    {df:1,dc:1},
    {df:-1,dc:-1},
    {df:1,dc:-1},
    {df:-1,dc:1}
  ];

  let ok=false;

  while(!ok){
    let d=dirs[Math.floor(Math.random()*dirs.length)];
    let f=Math.floor(Math.random()*tamaño);
    let c=Math.floor(Math.random()*tamaño);

    let posible=true;

    for(let i=0;i<p.length;i++){
      let nf=f+d.df*i,nc=c+d.dc*i;
      if(nf<0||nc<0||nf>=tamaño||nc>=tamaño||grid[nf][nc]!=""){
        posible=false;
        break;
      }
    }

    if(posible){
      for(let i=0;i<p.length;i++){
        grid[f+d.df*i][c+d.dc*i]=p[i];
      }
      ok=true;
    }
  }
}

function rellenar(){
  const letras="ABCDEFGHIJKLMNOPQRSTUVWXYZ";
  for(let i=0;i<tamaño;i++){
    for(let j=0;j<tamaño;j++){
      if(grid[i][j]==""){
        grid[i][j]=letras[Math.floor(Math.random()*26)];
      }
    }
  }
}

palabras.forEach(colocar);
rellenar();

/* resto del juego sigue igual (selección, dibujo, etc.) */

iniciarTiempo();

</script>

</body>
</html>
