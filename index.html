<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sopa de Letras PRO</title>

<style>
  body {
    margin: 0;
    font-family: Arial;
    background: #f5f1e8;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow-x: hidden;
  }

  body::before, body::after {
    content: "";
    position: fixed;
    border-radius: 50%;
    z-index: -1;
  }

  body::before {
    width: 280px;
    height: 280px;
    background: #bfe6c2;
    top: -90px;
    left: -90px;
  }

  body::after {
    width: 320px;
    height: 320px;
    background: #8fd19e;
    bottom: -120px;
    right: -120px;
  }

  .contenedor {
    text-align: center;
    width: 100%;
    padding: 10px;

    /* 🔥 sube todo en móvil */
    transform: translateY(-12px);
  }

  h2 {
    color: #2f5d3a;
    margin: 10px 0;
  }

  canvas {
    border: 3px solid #2f5d3a;
    background: white;
    border-radius: 12px;
    width: 90vw;
    max-width: 500px;
    touch-action: none;
    box-shadow: 0 10px 25px rgba(0,0,0,0.15);
  }

  #info {
    margin-top: 10px;
    font-weight: bold;
    color: #2f5d3a;
  }

  /* 📋 LISTA BONITA */
  #lista {
    margin-top: 8px;
    color: #2f5d3a;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 4px;
    font-size: 14px;
  }

  #lista div {
    text-align: left;
    padding: 2px 6px;
  }

  /* ✔️❌ animación */
  .icono {
    position: fixed;
    font-size: 60px;
    animation: pop 0.8s ease-out forwards;
    pointer-events: none;
    z-index: 9999;
  }

  @keyframes pop {
    0% { transform: translate(-50%,-50%) scale(0.3); opacity: 0; }
    40% { opacity: 1; }
    100% { transform: translate(-50%,-140%) scale(1.2); opacity: 0; }
  }

  .shake {
    animation: shake 0.3s;
  }

  @keyframes shake {
    25% { transform: translateX(-6px); }
    50% { transform: translateX(6px); }
    75% { transform: translateX(-6px); }
  }

  /* 📱 en celular sube más la sopa */
  @media (max-width: 600px) {
    .contenedor {
      transform: translateY(-25px);
    }

    #lista {
      font-size: 12px;
      grid-template-columns: 1fr 1fr;
    }
  }
</style>
</head>

<body>

<div class="contenedor">

<h2>Sopa de Letras 💚</h2>

<canvas id="canvas"></canvas>

<div id="info">
🧮 Puntaje: <span id="score">0</span>/9
</div>

<div id="lista"></div>

</div>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const tamaño = 14;

let grid = Array.from({length:tamaño},()=>Array(tamaño).fill(""));
let seleccion=[], marcadas=[], error=[];
let encontradas=[];

const palabras = [
  "ALEACIONES","HIERRO","METAL","FERROSO",
  "CARBONO","NOFERROSOS","FUSION","MEZCLA","HOMOGENEA"
];

// sonido simple
const audio = new (window.AudioContext || window.webkitAudioContext)();

function beep(f,t){
  let o=audio.createOscillator();
  let g=audio.createGain();
  o.frequency.value=f;
  o.connect(g); g.connect(audio.destination);
  g.gain.value=0.2;
  o.start();
  setTimeout(()=>o.stop(),t*1000);
}

// canvas responsive
function ajustar(){
  const size = Math.min(window.innerWidth * 0.9, 500);
  const dpr = window.devicePixelRatio || 1;

  canvas.style.width = size+"px";
  canvas.style.height = size+"px";

  canvas.width = size*dpr;
  canvas.height = size*dpr;

  ctx.setTransform(dpr,0,0,dpr,0,0);

  dibujar();
}

window.addEventListener("resize",ajustar);
ajustar();

function sizeCelda(){
  return canvas.width / (window.devicePixelRatio || 1) / tamaño;
}

function celda(x,y){
  const s=sizeCelda();
  return {fila:Math.floor(y/s),col:Math.floor(x/s)};
}

// palabras
function colocar(p){
  const dirs=[{df:0,dc:1},{df:1,dc:0},{df:1,dc:1},{df:-1,dc:1}];
  let ok=false;

  while(!ok){
    let d=dirs[Math.floor(Math.random()*dirs.length)];
    let f=Math.floor(Math.random()*tamaño);
    let c=Math.floor(Math.random()*tamaño);

    let posible=true;

    for(let i=0;i<p.length;i++){
      let nf=f+d.df*i,nc=c+d.dc*i;
      if(nf<0||nc<0||nf>=tamaño||nc>=tamaño||grid[nf][nc]!=""){
        posible=false; break;
      }
    }

    if(posible){
      for(let i=0;i<p.length;i++){
        grid[f+d.df*i][c+d.dc*i]=p[i];
      }
      ok=true;
    }
  }
}

function rellenar(){
  const letras="ABCDEFGHIJKLMNOPQRSTUVWXYZ";
  for(let i=0;i<tamaño;i++){
    for(let j=0;j<tamaño;j++){
      if(grid[i][j]==""){
        grid[i][j]=letras[Math.floor(Math.random()*26)];
      }
    }
  }
}

palabras.forEach(colocar);
rellenar();

// 🎨 dibujar
function dibujar(){
  const s=sizeCelda();

  ctx.clearRect(0,0,canvas.width,canvas.height);

  ctx.font=(s*0.6)+"px Arial";
  ctx.textAlign="center";
  ctx.textBaseline="middle";

  for(let i=0;i<tamaño;i++){
    for(let j=0;j<tamaño;j++){
      ctx.strokeRect(j*s,i*s,s,s);
      ctx.fillStyle="black";
      ctx.fillText(grid[i][j],j*s+s/2,i*s+s/2);
    }
  }

  ctx.fillStyle="rgba(0,200,100,0.4)";
  marcadas.forEach(c=>ctx.fillRect(c.col*s,c.fila*s,s,s));

  ctx.fillStyle="rgba(255,0,0,0.4)";
  error.forEach(c=>ctx.fillRect(c.col*s,c.fila*s,s,s));

  if(seleccion.length>0){
    ctx.fillStyle="rgba(0,150,255,0.25)";
    seleccion.forEach(c=>ctx.fillRect(c.col*s,c.fila*s,s,s));
  }
}

// selección tipo dedo
let arrastrando=false;

canvas.addEventListener("mousedown",start);
canvas.addEventListener("mousemove",move);
canvas.addEventListener("mouseup",end);

canvas.addEventListener("touchstart",start);
canvas.addEventListener("touchmove",(e)=>{e.preventDefault();move(e);},{passive:false});
canvas.addEventListener("touchend",end);

function start(e){
  arrastrando=true;
  seleccion=[];
  let r=canvas.getBoundingClientRect();
  let x=(e.touches?e.touches[0].clientX:e.clientX)-r.left;
  let y=(e.touches?e.touches[0].clientY:e.clientY)-r.top;
  seleccion.push(celda(x,y));
}

function move(e){
  if(!arrastrando)return;

  let r=canvas.getBoundingClientRect();
  let x=(e.touches?e.touches[0].clientX:e.clientX)-r.left;
  let y=(e.touches?e.touches[0].clientY:e.clientY)-r.top;

  let c=celda(x,y),i=seleccion[0];
  let df=c.fila-i.fila,dc=c.col-i.col;

  if(df===0||dc===0||Math.abs(df)===Math.abs(dc)){
    seleccion=[];
    let f=i.fila,col=i.col;
    let pf=Math.sign(df),pc=Math.sign(dc);

    while(true){
      seleccion.push({fila:f,col:col});
      if(f===c.fila&&col===c.col) break;
      f+=pf; col+=pc;
    }
  }

  dibujar();
}

function end(){
  arrastrando=false;
  verificar();
}

// UI LISTA 🔥
function actualizar(){
  document.getElementById("lista").innerHTML =
    palabras.map(p=>{
      let ok=encontradas.includes(p);
      return `<div>${ok?"✔️":"⬜"} ${p}</div>`;
    }).join("");

  document.getElementById("score").innerText=encontradas.length;
}

function verificar(){
  let palabra=seleccion.map(c=>grid[c.fila][c.col]).join("");

  const r=canvas.getBoundingClientRect();

  if(palabras.includes(palabra) && !encontradas.includes(palabra)){
    encontradas.push(palabra);
    marcadas.push(...seleccion);
    beep(700,0.1);
  } else {
    error=[...seleccion];
    beep(150,0.2);
    canvas.classList.add("shake");
    setTimeout(()=>{canvas.classList.remove("shake");error=[];dibujar();},500);
  }

  actualizar();

  setTimeout(()=>{
    seleccion=[];
    dibujar();
  },300);
}

actualizar();
dibujar();
</script>

</body>
</html>
